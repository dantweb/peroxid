name: Deploy to pay1.oxid.dev

# MANUAL ONLY: never on push. Starting it is a decision of the project owner.
# Ships the build to /var/www/oxid/oxid75/peroxid on pay1.oxid.dev:
#   pay1.oxid.dev:2053  hydroxid-vibrant     pay1.oxid.dev:2083  hydroxid-dark-ocean
#   pay1.oxid.dev:8443  hydroxid-light-red
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true

permissions:
  contents: read

concurrency: deploy-pay1

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    environment: pay1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read access to the private packages (read-only deploy keys)
        env:
          CORE_KEY: ${{ secrets.CORE_DEPLOY_KEY }}
          USER_KEY: ${{ secrets.USER_DEPLOY_KEY }}
        run: sh .github/scripts/private-deps.sh
      - run: npm ci
      - run: npm run lint && npm run type-check && npm test && npm audit
      - run: npm run build
      - name: SSH access to pay1 (pinned host key)
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship and activate
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_OPTS: -i ~/.ssh/deploy -o StrictHostKeyChecking=yes
        run: sh deploy/deploy.sh
      - name: Smoke test the three ports (config, YAML hidden, cache policy)
        run: |
          for port in 2053 2083 8443; do
            base="https://pay1.oxid.dev:$port"
            curl -fsS "$base/oxid-config.json" | grep -q hydroxid
            code="$(curl -s -o /dev/null -w '%{http_code}' "$base/oxid-config.yaml")"
            [ "$code" = 404 ] || { echo "oxid-config.yaml answered $code on $port" >&2; exit 1; }
            # a phone that loaded an earlier release must pick up this one: no stale index / theme / config
            header() { curl -sI "$1" | tr -d '\r' | grep -i '^cache-control:' | tr 'A-Z' 'a-z'; }
            theme="$(curl -fsS "$base/oxid-config.json" | sed -n 's/.*"active": "\(hydroxid-[a-z-]*\)".*/\1/p' | head -1)"
            header "$base/" | grep -q 'no-cache'                               || { echo "index is cacheable on $port" >&2; exit 1; }
            header "$base/themes/$theme/config.json" | grep -q 'no-cache'       || { echo "theme config is cacheable on $port" >&2; exit 1; }
            header "$base/themes/$theme/styles/styles.css" | grep -q 'no-cache' || { echo "theme css is cacheable on $port" >&2; exit 1; }
            header "$base/oxid-config.json" | grep -q 'no-store'                || { echo "config json is cacheable on $port" >&2; exit 1; }
            asset="$(curl -fsS "$base/" | sed -n 's|.*src="\(/assets/[^"]*\.js\)".*|\1|p' | head -1)"
            header "$base$asset" | grep -q 'immutable'                          || { echo "hashed bundle not immutable on $port" >&2; exit 1; }
          done
